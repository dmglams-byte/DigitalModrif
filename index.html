<style>
:root{--bg:#000;--bg2:#080808;--p:#C9A24B;--v:#E6C876;--mut:#A1A1AA;--line:rgba(255,255,255,.10)}
html{scroll-behavior:smooth;scroll-padding-top:80px;background:var(--bg)}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.f{font-family:Sora,'Space Grotesk',system-ui,sans-serif}
.gt{background:linear-gradient(100deg,#fff 0%,var(--v) 45%,var(--p) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:linear-gradient(160deg,#121212,#0c0c0c);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;transition:.4s}
.glass:hover{border-color:rgba(230,200,118,.7);box-shadow:0 0 40px -8px rgba(201,162,75,.55);transform:translateY(-6px)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.6rem;border-radius:999px;font-weight:600;font-size:.95rem;transition:.3s;cursor:pointer;border:1px solid var(--line);color:#fff;background:transparent}
.btn:hover{border-color:var(--v);box-shadow:0 0 24px rgba(201,162,75,.4)}
.btn.pri{color:#0a0703;background:linear-gradient(120deg,var(--p),var(--v));border-color:transparent;box-shadow:0 0 28px rgba(201,162,75,.55)}
.btn.pri:hover{box-shadow:0 0 48px rgba(230,200,118,.85);transform:translateY(-2px)}
.lab{letter-spacing:.22em;font-size:.72rem;font-weight:600;color:var(--v);text-transform:uppercase}
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.orb{position:relative;width:min(78vw,460px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff3d0 0,#E6C876 18%,#8a6420 45%,#1a1205 72%,#000 100%);box-shadow:0 0 100px 10px rgba(201,162,75,.3),inset -40px -40px 90px rgba(0,0,0,.6);animation:fl 7s ease-in-out infinite}
.orb::before,.orb::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(230,200,118,.5);transform:rotateX(72deg);animation:sp 14s linear infinite}
.orb::after{inset:-26%;border-color:rgba(201,162,75,.28);transform:rotateX(72deg) rotateZ(40deg);animation-duration:22s;animation-direction:reverse}
@keyframes fl{50%{transform:translateY(-18px)}}
@keyframes sp{to{rotate:360deg}}
@keyframes dr{50%{transform:translate(30px,-20px) scale(1.15)}}
.blob{position:absolute;border-radius:50%;filter:blur(90px);background:var(--p);opacity:.13;animation:dr 12s ease-in-out infinite;pointer-events:none}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.fld{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;color:#fff;font-size:.95rem;outline:none;transition:.3s}
.fld:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(201,162,75,.25)}
.fld option{background:#0D0D0D}
.mq{display:flex;gap:3rem;width:max-content;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---- responsive & touch polish ---- */
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--v);outline-offset:3px;border-radius:6px}
@media (hover:none){.glass:hover{transform:none;box-shadow:none}.btn.pri:hover{transform:none}}
@media (max-width:380px){h1{overflow-wrap:anywhere}.btn{padding:.8rem 1.2rem}}
</style>

    <div className="relative rounded-[1.75rem] p-[2px]" style=${{background:'linear-gradient(135deg,#E6C876,#9a7220 40%,#C9A24B 70%,#E6C876)',boxShadow:'0 0 70px -12px rgba(201,162,75,.5)'}}><${Img} src=${FOUNDER_IMG} alt="Founder of Modrif Digital" w=${900} ht=${900} lazy=${true} className="block w-full aspect-square object-cover rounded-[1.65rem] bg-black" fb=${h`<div className="grid place-items-center w-full aspect-square rounded-[1.65rem] bg-black f text-5xl font-bold gt">MD</div>`}/></div>
    <span className="absolute left-1/2 bottom-0 -translate-x-1/2 whitespace-nowrap rounded-full border border-[#C9A24B]/50 bg-black px-5 py-2 text-[10px] sm:text-xs tracking-[.2em] uppercase text-[#E6C876] f">Founder · Modrif Digital</span>
  </div><//>
  <div><${Head} label="Meet the Founder">A Vision Behind <span className="gt">The Brand</span><//>
    <${Rv} d=${100}><p className="f text-xl sm:text-2xl font-semibold mt-7">Hi, I’m the founder of <span className="gt">MODRIF DIGITAL.</span></p><//>
    <${Rv} d=${180}><p className="mt-5 text-[#A1A1AA] leading-relaxed">I’m passionate about digital creativity, technology, and helping businesses build a strong online presence. I started MODRIF DIGITAL with a vision to make digital solutions more accessible for brands and businesses looking to grow.</p><//>
    <${Rv} d=${260}><p className="mt-4 text-[#A1A1AA] leading-relaxed">From website development and Shopify stores to AI-powered website customization and social media advertising, my goal is to create solutions that combine creativity, functionality, and purpose.</p><//>
    <${Rv} d=${340}><p className="mt-4 text-[#A1A1AA] leading-relaxed">I believe every great brand starts with an idea — and I’m here to help bring those ideas to life.</p><//>
    <${Rv} d=${420}><div className="mt-8 flex items-center gap-4"><span className="h-px w-12 bg-gradient-to-r from-[#C9A24B] to-transparent"/><p className="f text-lg sm:text-xl font-bold gt">Let’s build something meaningful together.</p></div><//>
  </div></div><//>`;

const Process=()=>h`<${Sec} id="process"><${Head} label="Our Process" center=${true}>From First Idea to <span className="gt">Digital Launch.</span><//>
  <div className="mt-16 relative grid md:grid-cols-4 gap-10 md:gap-6">
    <div className="hidden md:block absolute top-7 left-[12.5%] right-[12.5%] h-px" style=${{background:'linear-gradient(90deg,transparent,#C9A24B,#E6C876,#C9A24B,transparent)',boxShadow:'0 0 12px #C9A24B'}}/>
    <div className="md:hidden absolute top-7 bottom-7 left-7 w-px" style=${{background:'linear-gradient(#C9A24B,transparent)'}}/>
    ${[['Discover','We understand your business, audience and goals.'],['Strategize','We create a clear plan for the right digital solution.'],['Design & Develop','We bring your vision to life through creative design and development.'],['Launch & Improve','We launch, review and refine the final experience.']].map(([t,d],k)=>h`<${Rv} key=${t} d=${k*140}><div className="relative flex md:block gap-6 md:text-center">
      <span className="f relative z-10 shrink-0 grid place-items-center w-14 h-14 rounded-full font-bold bg-[#000000] md:mx-auto border border-[#E6C876]" style=${{boxShadow:'0 0 30px rgba(201,162,75,.7),inset 0 0 14px rgba(201,162,75,.4)'}}>0${k+1}</span>
      <div className="md:mt-7"><h3 className="f font-bold text-lg">${t}</h3><p className="text-sm text-[#A1A1AA] mt-2 leading-relaxed">${d}</p></div></div><//>`)}</div><//>`;

const CTA=()=>h`<section className="relative px-5 sm:px-8 py-24 sm:py-32 overflow-hidden text-center" style=${{background:'radial-gradient(ellipse at 50% 125%,rgba(201,162,75,.5) 0,rgba(110,80,20,.22) 34%,#000 70%)'}}>
  <div className="absolute inset-0 grid-bg opacity-70"/><div className="blob w-[420px] h-[420px] left-1/2 -translate-x-1/2 top-0 opacity-20"/>
  <div className="relative max-w-3xl mx-auto"><${Rv}><h2 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold leading-[1.08]">Ready to Build <span className="gt">Something Extraordinary?</span></h2><p className="mt-6 text-white/70 text-lg">Let’s turn your ideas into a powerful digital experience.</p><div className="mt-9 flex flex-wrap justify-center gap-4"><a href="#contact" className="btn pri !px-9 !py-4">Start Your Project <${I} n="arrow" s=${18}/></a><a href=${LINKS.wa} target="_blank" rel="noopener noreferrer" className="btn !px-9 !py-4"><${I} n="wa" s=${18}/> Chat With Us</a></div><//></div></section>`;

/* ---------- Contact form ----------
   INTEGRATION POINT: paste a form endpoint (e.g. Formspree, Web3Forms, your own API) below.
   Until then the form validates and shows an honest “not connected” message instead of faking delivery. */
const FORM_ENDPOINT='https://formspree.io/f/myeeblej';
function Contact(){
  const [st,setSt]=useState({s:'idle',m:''});
  const submit=async e=>{
    e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
    if(!/^\S+@\S+\.\S+$/.test(d.email||'')){setSt({s:'err',m:'Please enter a valid email address.'});return}
    if(!FORM_ENDPOINT){setSt({s:'err',m:'The form is not connected to a delivery service yet, so your message was not sent. Please email digitalmodrif@gmail.com or chat with us on WhatsApp instead.'});return}
    setSt({s:'load',m:''});
    try{const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});
      if(!r.ok)throw 0;f.reset();setSt({s:'ok',m:'Thank you! Your inquiry has been sent. We’ll get back to you soon.'})}
    catch{setSt({s:'err',m:'Something went wrong while sending. Please try again or email us directly.'})}
  };
  const L=({t,children})=>h`<label className="block text-xs text-[#A1A1AA] mb-2">${t}${children}</label>`;
  return h`<${Sec} id="contact" className="bg-[#0D0D0D]"><div className="grid lg:grid-cols-[.9fr_1.1fr] gap-12">
    <div><${Head} label="Contact">Let’s Talk About Your <span className="gt">Next Project.</span><//>
      <${Rv} d=${100}><div className="mt-10 space-y-4">${[['mail','01','Email',LINKS.email,LINKS.mail,false],['ig','02','Instagram',LINKS.igName,LINKS.ig,true],['wa','03','WhatsApp',LINKS.waNum,LINKS.wa,true]].map(([i,n,a,b,l,ex])=>h`<a key=${a} href=${l} target=${ex?'_blank':undefined} rel=${ex?'noopener noreferrer':undefined} className="glass !rounded-2xl flex items-center gap-4 p-4 sm:p-5 group"><span className="grid place-items-center w-12 h-12 shrink-0 rounded-xl border border-[#C9A24B]/40 bg-[#C9A24B]/10 text-[#E6C876] transition group-hover:shadow-[0_0_20px_rgba(201,162,75,.5)]"><${I} n=${i} s=${20}/></span><span className="min-w-0 flex-1"><span className="block text-xs text-[#A1A1AA]">${n} · ${a}</span><span className="flex items-center gap-2 text-white break-words">${a==='Instagram'&&h`<${I} n="ig" s=${17} c="text-[#E6C876] shrink-0"/>`}${b}</span></span><${I} n="arrow" s=${16} c="text-[#E6C876] shrink-0 transition-transform group-hover:translate-x-1"/></a>`)}
      <a href=${LINKS.wa} target="_blank" rel="noopener noreferrer" className="btn pri mt-2"><${I} n="wa" s=${18}/> Chat With Us</a>
      <div className="flex items-center gap-2 text-sm text-[#A1A1AA] pt-2"><${I} n="pin" s=${16} c="text-[#E6C876]"/>${LINKS.location}</div></div><//></div>
    <${Rv} d=${100}><form onSubmit=${submit} className="glass !transform-none hover:!shadow-none p-6 sm:p-9 grid sm:grid-cols-2 gap-5" noValidate>
      <${L} t="Full Name"><input name="name" required className="fld mt-0" placeholder="Your name"/><//>
      <${L} t="Email Address"><input name="email" type="email" required className="fld" placeholder="you@company.com"/><//>
      <${L} t="Business Name"><input name="business" className="fld" placeholder="Your business"/><//>
      <${L} t="Select a Service"><select name="service" required className="fld" defaultValue=""><option value="" disabled>Choose a service</option><option>Shopify Store Development</option><option>Website Design & Development</option><option>AI Website Customization</option><option>Meta Ads & Digital Advertising</option><option>Not sure yet</option></select><//>
      <div className="sm:col-span-2"><${L} t="Project Budget (optional)"><select name="budget" className="fld" defaultValue=""><option value="">Prefer not to say</option><option>Under $300</option><option>$300 – $700</option><option>$700 – $1,500</option><option>$1,500+</option></select><//></div>
      <div className="sm:col-span-2"><${L} t="Tell Us About Your Project"><textarea name="message" required rows="5" className="fld resize-none" placeholder="What are you looking to build?"/><//></div>
      <div className="sm:col-span-2"><button disabled=${st.s==='load'} className="btn pri w-full justify-center disabled:opacity-60">${st.s==='load'?'Sending…':'Send Project Inquiry'} <${I} n="send" s=${17}/></button>
        ${st.m&&h`<p role="status" className=${'mt-4 text-sm rounded-xl px-4 py-3 border '+(st.s==='ok'?'border-emerald-400/40 text-emerald-300 bg-emerald-400/10':'border-rose-400/40 text-rose-300 bg-rose-400/10')}>${st.m}</p>`}</div>
    </form><//></div><//>`;
}

const Footer=()=>h`<footer className="relative px-5 sm:px-8 pt-16 pb-8 border-t border-white/10 bg-[#000000]"><div className="max-w-7xl mx-auto">
  <div className="grid sm:grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr] gap-10">
    <div><${Logo}/><p className="mt-5 text-sm text-[#A1A1AA] max-w-xs leading-relaxed">A creative digital & e-commerce agency helping ambitious businesses build, strengthen and grow their online presence.</p>
      <div className="flex gap-3 mt-6">${[['ig',LINKS.ig,'Instagram'],['wa',LINKS.wa,'WhatsApp'],['mail',LINKS.mail,'Email']].map(([i,l,nm])=>h`<a key=${i} href=${l} target=${i==='mail'?undefined:'_blank'} rel=${i==='mail'?undefined:'noopener noreferrer'} aria-label=${nm} className="grid place-items-center w-10 h-10 rounded-full border border-[#C9A24B]/30 text-[#E6C876] hover:bg-[#C9A24B]/20 hover:shadow-[0_0_18px_rgba(201,162,75,.5)] transition"><${I} n=${i} s=${18}/></a>`)}</div></div>
    <div><h4 className="f font-semibold mb-4">Quick Links</h4><ul className="space-y-2.5 text-sm text-[#A1A1AA]">${NAV.map(([t,l])=>h`<li key=${t}><a href=${l} className="hover:text-white transition">${t}</a></li>`)}</ul></div>
    <div><h4 className="f font-semibold mb-4">Our Services</h4><ul className="space-y-2.5 text-sm text-[#A1A1AA]">${SV.map(s=>h`<li key=${s.t}><a href="#services" className="hover:text-white transition">${s.t}</a></li>`)}</ul></div>
    <div><h4 className="f font-semibold mb-4">Contact</h4><ul className="space-y-2.5 text-sm text-[#A1A1AA]"><li><a href=${LINKS.mail} className="hover:text-white transition">${LINKS.email}</a></li><li><a href=${LINKS.ig} target="_blank" rel="noopener noreferrer" className="hover:text-white transition inline-flex items-center gap-2"><${I} n="ig" s=${15} c="text-[#E6C876]"/>${LINKS.igName}</a></li><li><a href=${LINKS.wa} target="_blank" rel="noopener noreferrer" className="hover:text-white transition">${LINKS.waNum}</a></li><li>${LINKS.location}</li></ul></div>
  </div>
  <p className="f text-center gt text-lg sm:text-2xl font-bold mt-14">Think Digital. Create Better. Grow Smarter.</p>
  <p className="text-center text-xs text-[#A1A1AA] mt-8 pt-6 border-t border-white/5">© ${new Date().getFullYear()} Modrif Digital. All rights reserved.</p></div></footer>`;

const App=()=>{
  const hs=useHash(),pi=PJ.findIndex(p=>!p.soon&&hs==='#project-'+p.id);
  useEffect(()=>{
    if(pi>=0){scrollTo({top:0,behavior:'instant'});return}
    const el=hs.length>1&&document.getElementById(hs.slice(1));
    if(el)setTimeout(()=>el.scrollIntoView(),30);else scrollTo({top:0,behavior:'instant'});
  },[hs]);
  return pi>=0?h`<${Nav}/><${ProjectPage} key=${PJ[pi].id} p=${PJ[pi]} i=${pi}/><${Footer}/>`
    :h`<${Nav}/><main><${Hero}/><${Strip}/><${About}/><${Founder}/><${Services}/><${Why}/><${Portfolio}/><${Process}/><${CTA}/><${Contact}/></main><${Footer}/>`;
};
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
</html>
